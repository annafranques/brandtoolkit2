<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Toolkit - Login</title>
    
    <style>
        @font-face {
            font-family: 'Favorit';
            src: url('fonts/FavoritPro-Book.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Favorit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F5F1EC;
            color: #1A1A1A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }

        .login-box {
            background: #fff;
            padding: 4rem 3rem;
            border: none;
        }

        .login-label {
            font-family: 'Favorit', sans-serif;
            font-size: 0.625rem;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(0,0,0,0.38);
            display: block;
            margin-bottom: 2rem;
        }

        .login-box h1 {
            font-family: 'Favorit', sans-serif;
            font-size: 3rem;
            font-weight: normal;
            color: #1A1A1A;
            letter-spacing: -0.03em;
            line-height: 1.0;
            margin-bottom: 3.5rem;
        }

        .form-group { margin-bottom: 2rem; }

        .form-group label {
            display: block;
            font-family: 'Favorit', sans-serif;
            font-size: 0.6875rem;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(0,0,0,0.38);
            margin-bottom: 0.75rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 0;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,0.18);
            border-radius: 0;
            font-family: 'Favorit', sans-serif;
            font-size: 1rem;
            color: #1A1A1A;
            background: transparent;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-bottom-color: #1A1A1A; }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: #1A1A1A;
            color: #fff;
            border: none;
            border-radius: 0;
            font-family: 'Favorit', sans-serif;
            font-size: 0.75rem;
            font-weight: normal;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 2rem;
        }
        .btn-login:hover { background: #333; }
        .btn-login:disabled { background: rgba(0,0,0,0.28); cursor: not-allowed; }

        .error-message {
            color: #b91c1c;
            margin-top: 1.25rem;
            font-family: 'Favorit', sans-serif;
            font-size: 0.8125rem;
            display: none;
            letter-spacing: 0.02em;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <span class="login-label">Admin</span>
            <h1>Brand Toolkit</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
                </div>
                <button type="submit" class="btn-login" id="login-btn">Login</button>
                <div class="error-message" id="error-message"></div>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            
            errorMessage.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password }),
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: 'Login failed' }));
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/admin.html';
                } else {
                    errorMessage.textContent = data.error || 'Invalid password. Please try again.';
                    errorMessage.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'An error occurred. Please try again.';
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
