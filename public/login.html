<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Toolkit - Login</title>
    
    <style>
        @font-face {
            font-family: 'Favorit';
            src: url('fonts/FavoritPro-Book.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Favorit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        
        .login-box {
            background: #fff;
            padding: 3rem 2.5rem;
            border: 1px solid #e0e0e0;
        }
        
        .login-box h1 {
            font-family: 'Favorit', sans-serif;
            font-size: 2.5rem;
            font-weight: normal;
            color: #000;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 3rem;
            text-align: left;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: 'Favorit', sans-serif;
            font-size: 0.875rem;
            font-weight: normal;
            color: #000;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 0;
            font-family: 'Favorit', sans-serif;
            font-size: 0.875rem;
            color: #000;
            background: #fff;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #000;
        }
        
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background-color: #000;
            color: #fff;
            border: none;
            font-family: 'Favorit', sans-serif;
            font-size: 0.875rem;
            font-weight: normal;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }
        
        .btn-login:hover {
            background-color: #333;
        }
        
        .btn-login:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #d32f2f;
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #ffebee;
            border-radius: 0;
            display: none;
            font-family: 'Favorit', sans-serif;
            font-size: 0.875rem;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Brand Toolkit</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
                </div>
                <button type="submit" class="btn-login" id="login-btn">Login</button>
                <div class="error-message" id="error-message"></div>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            
            errorMessage.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password }),
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: 'Login failed' }));
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/admin.html';
                } else {
                    errorMessage.textContent = data.error || 'Invalid password. Please try again.';
                    errorMessage.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'An error occurred. Please try again.';
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
